controller:
  admin:
    username: "admin"
    password: "admin123"

  # Tắt tự động tải plugin lúc init để tránh lỗi SSL PKIX từ proxy mạng
  # installPlugins: []

  ingress:
    enabled: true
    ingressClassName: "nginx"
    hostName: "jenkins.local"
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    tls:
      - secretName: jenkins-local-tls
        hosts:
          - jenkins.local

  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2048Mi"

  persistence:
    enabled: true
    size: "10Gi"
