global:
  domain: argocd.local

dex:
  enabled: false

server:
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.local
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    extraTls:
      - hosts:
          - argocd.local
        secretName: argocd-local-tls
