apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: custom-resources
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/kh0inv/local-lab.git'
    targetRevision: main
    path: custom-resources
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
