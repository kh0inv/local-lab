apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://argoproj.github.io/argo-helm'
      chart: argo-cd
      targetRevision: 10.10.5
      helm:
        valueFiles:
          - $values/argocd/custom-values.yaml # Lấy file values từ Source 2

    # Source 2: Lấy file cấu hình từ Git Repo của bạn
    - repoURL: 'https://github.com/kh0inv/local-lab.git'
      targetRevision: main
      ref: values

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
